<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balkan Agent — Create Account</title>
<style>
:root{--bg:#020611;--panel:#07101d;--line:#183b60;--text:#f8f9fc;--muted:#9eacc0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 60% 0,#151c45,#020611 62%);color:var(--text);font:14px/1.5 system-ui;display:grid;place-items:center;padding:22px}
a{color:#9eb2ff;text-decoration:none}input,button{font:inherit}.box{width:min(560px,100%);background:#06101d;border:1px solid #193b60;border-radius:17px;box-shadow:0 30px 90px #000;padding:28px}
h1{margin:0 0 7px}.sub{color:var(--muted);margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:#a6b3c4;font-size:12px;margin-bottom:5px}input{width:100%;background:#06101d;color:#fff;border:1px solid #26466b;border-radius:9px;padding:12px}.btn{width:100%;border:0;background:linear-gradient(135deg,#7538ff,#315cff);color:#fff;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}.msg{margin-top:12px;font-size:12px}.ok{color:#34e09a}.err{color:#ff8190}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}

<style id="ba-brand-system-v10">
:root{--bg:#07090d!important;--panel:#0e1319!important;--line:#4a3920!important;--text:#f6f2e8!important;--muted:#b2ac9e!important;--gold:#d8ad5e!important;--violet:#b99046!important;--blue:#d3a858!important;--green:#d0ad62!important}
html,body{background:radial-gradient(900px 500px at 70% -10%,rgba(121,88,35,.22),transparent 62%),#07090d!important;color:#f6f2e8!important}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}
.panel,.metric,.box,.loginBox,.modalCard{background:linear-gradient(155deg,rgba(20,23,25,.97),rgba(10,12,14,.98))!important;border-color:rgba(194,149,70,.34)!important;box-shadow:0 20px 50px rgba(0,0,0,.32),inset 0 1px rgba(255,244,207,.05)!important}
.brand,.bn{color:#f5efe2!important;letter-spacing:2px}.brand span,.bn span{color:#d8ad5e!important}.tag{color:#c4a36b!important;letter-spacing:1.6px!important}
nav button,nav a{color:#c4bcae!important;border-radius:10px!important;transition:background .18s ease,color .18s ease,border-color .18s ease}nav button:hover,nav a:hover{background:rgba(165,119,40,.16)!important;color:#fff!important}nav .active{background:linear-gradient(135deg,rgba(134,94,27,.30),rgba(49,38,20,.40))!important;color:#fff!important;border-left-color:#d8ad5e!important}
.btn{background:rgba(31,26,18,.84)!important;border-color:rgba(194,149,70,.45)!important;color:#f8efda!important;border-radius:999px!important;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.btn:hover{transform:translateY(-2px);border-color:#dfb86b!important;box-shadow:0 12px 28px rgba(0,0,0,.26)}.btn.primary{background:linear-gradient(135deg,#a77a2f,#d2aa5d)!important;color:#1a1105!important;border-color:#e0ba70!important}.btn.success{border-color:#9c7938!important;color:#e9c982!important;background:rgba(63,46,19,.65)!important}.btn.danger{border-color:#7d4437!important;background:rgba(51,24,19,.60)!important}
input,select{background:rgba(9,12,15,.86)!important;color:#f7f0e1!important;border-color:rgba(194,149,70,.33)!important;border-radius:10px!important}input:focus,select:focus{outline:2px solid rgba(218,175,92,.60)!important;outline-offset:2px}
.notice{background:rgba(62,45,18,.32)!important;border-color:rgba(212,168,87,.43)!important;color:#e5c77f!important}.metric small,small{color:#baa98d!important}.metric b{color:#f5ead2!important}.activeBadge,.ok{color:#d8bd79!important}.inactiveBadge,.err{color:#df8b78!important}h1,h2,h3{color:#f6f1e6!important}th{color:#c0aa80!important}td{border-bottom-color:rgba(184,139,62,.18)!important}.detail div{background:rgba(51,38,18,.32)!important}.status{background:rgba(47,35,18,.62)!important;border-color:rgba(195,149,70,.42)!important}.modal{background:rgba(0,0,0,.78)!important}
.loginBox .header{border-bottom-color:rgba(194,149,70,.28)!important}.ba{background:linear-gradient(135deg,#f5d58d,#b77f2d,#f0cc82)!important;-webkit-background-clip:text!important;color:transparent!important;text-shadow:0 0 18px rgba(204,155,64,.16)}.back,a{color:#d5b97d!important}.sub{color:#b9ad98!important}.box a{color:#d7b972!important}
@media(max-width:700px){aside{border-right:0!important;border-bottom:1px solid rgba(194,149,70,.25)!important}.metrics{gap:12px!important}}
</style></style></head><body>
<div class="box"><h1>Create account</h1><div class="sub">Napravite Balkan Agent profil. Admin mora aktivirati nalog prije prve prijave.</div>
<form id="registerForm"><div class="grid">
<div><label>Ime i prezime</label><input id="name" required></div>
<div><label>Firma</label><input id="company"></div>
<div><label>Email</label><input id="email" type="email" required></div>
<div><label>Broj telefona</label><input id="phone" type="tel" value="+38268400509"></div>
<div class="full"><label>Šifra</label><input id="password" type="password" minlength="8" required></div>
<div class="full"><button class="btn" type="submit">Create account</button></div>
</div></form>
<div id="msg" class="msg"></div>
<div style="margin-top:18px"><a href="login.html">← Login</a></div>
</div>
<script>
document.getElementById('registerForm').onsubmit=async(e)=>{
 e.preventDefault();
 const m=document.getElementById('msg');m.className='msg';m.textContent='Creating...';
 try{
   const r=await fetch('/api/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
     name:document.getElementById('name').value.trim(),
     company:document.getElementById('company').value.trim(),
     email:document.getElementById('email').value.trim(),
     phone:document.getElementById('phone').value.trim(),
     password:document.getElementById('password').value
   })});
   const j=await r.json();if(!r.ok)throw new Error(j.error||'Registration failed');
   m.className='msg ok';m.textContent='✓ Profil napravljen. Čeka aktivaciju Admina.';
   e.target.reset();
 }catch(err){m.className='msg err';m.textContent=err.message}
}
</script></body></html>
