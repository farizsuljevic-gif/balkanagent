<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balkan Agent Dashboard Design</title>
<style>body{margin:0;background:#030814;color:#fff;font-family:system-ui;text-align:center}header{padding:24px}button{padding:12px 18px;margin:6px;border-radius:10px;border:1px solid #6e4cff;background:#15102f;color:#fff;cursor:pointer}.active{background:#7040e7}img{display:block;width:min(96%,1600px);margin:0 auto 40px;border:1px solid #1c304c;border-radius:14px;box-shadow:0 20px 70px #000}p{color:#9dacc2}</style></head><body><header><h1>Balkan Agent — Dashboard Design</h1><p>Visual prototype before backend integration</p><button id="a" class="active" onclick="show('admin')">Admin Panel</button><button id="c" onclick="show('customer')">Customer Panel</button></header><img id="view" src="admin-dashboard-example.png"><script>function show(x){document.getElementById('view').src=x==='admin'?'admin-dashboard-example.png':'customer-dashboard-example.png';document.getElementById('a').className=x==='admin'?'active':'';document.getElementById('c').className=x==='customer'?'active':''}</script></body></html>
