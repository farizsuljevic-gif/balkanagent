<!doctype html>
<html lang="sr-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balkan Agent — Login</title>
<style>
:root{--bg:#020611;--panel:#07101d;--line:#183b60;--text:#f8f9fc;--muted:#9eacc0;--violet:#743cff;--blue:#0abfff;--green:#34e09a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 60% 0,#151c45,#020611 62%);color:var(--text);font:14px/1.5 system-ui;display:grid;place-items:center;padding:22px}
a{text-decoration:none;color:inherit}
button,input{font:inherit}
.loginBox{width:min(520px,100%);background:#06101d;border:1px solid #193b60;border-radius:17px;box-shadow:0 30px 90px #000;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:21px 24px;border-bottom:1px solid #17324f}
.brand{display:flex;align-items:center;gap:11px}
.ba{font-size:40px;font-weight:950;letter-spacing:-5px;background:linear-gradient(135deg,#00adff,#bd4cff,#ff8bdc);-webkit-background-clip:text;color:transparent}
.bn{font-size:19px;font-weight:850}.bn span{color:#6684ff}.tag{font-size:8px;color:#9ca9ba;letter-spacing:1.2px}
.back{color:#9fb4d2;font-size:12px}
.body{padding:28px 26px 30px}
h1{font-size:30px;margin:0 0 8px}
.subtitle{color:var(--muted);margin:0 0 23px}
.field{margin-bottom:14px}
label{display:block;color:#a6b3c4;font-size:12px;margin-bottom:6px}
input{width:100%;background:#06101d;color:#fff;border:1px solid #26466b;border-radius:9px;padding:12px}
.btn{width:100%;border:0;background:linear-gradient(135deg,#7538ff,#315cff);color:#fff;border-radius:10px;padding:13px 15px;cursor:pointer;font-weight:700}
#msg{font-size:12px;margin-top:12px;min-height:18px}
.error{color:#ff8190}.success{color:#34e09a}
.help{border-top:1px solid #17324f;padding:15px 26px;color:#8798ad;font-size:11px}
 .authLang{position:fixed;top:16px;right:18px}.authLang select{background:#06101d;color:#fff;border:1px solid #26466b;border-radius:8px;padding:8px} </style>
</head>
<body>
<div class="loginBox">
  <div class="authLang"><select id="authLang"><option>Crnogorski</option><option>English</option><option>Deutsch</option><option>Русский</option><option>Shqip</option><option>Slovenščina</option><option>Македонски</option><option>Български</option><option>Ελληνικά</option><option>Română</option><option>Türkçe</option></select></div><div class="header">
    <a href="index.html" class="brand">
      <div class="ba">BA</div>
      <div><div class="bn">BALKAN <span>AGENT</span></div><div class="tag">AI AUTOMATION PLATFORM</div></div>
    </a>
    <a href="index.html" class="back">← Nazad</a>
  </div>
  <div class="body">
    <h1>Login</h1>
    <p class="subtitle">Prijavite se svojim emailom.</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="email@company.com">
      </div><div class="field"><label>Šifra</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Login</button>
      <div id="msg"></div>
    </form>
  </div>
  <div class="help">Nemate nalog? <a href="register.html" style="color:#9eb2ff">Napravite profil</a></div>
</div>



<script>
document.getElementById('loginForm').onsubmit=async(e)=>{
  e.preventDefault();
  const msg=document.getElementById('msg');
  msg.className=''; msg.textContent=(AUTH_I18N[localStorage.getItem('ba_auth_lang')||'Crnogorski']||AUTH_I18N.Crnogorski).creating||'Prijava...';
  try{
    const r=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({
        email:document.getElementById('email').value.trim(),
        password:document.getElementById('password').value
      })
    });
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Login failed');
    location.href=j.role==='admin'?'admin.html':'customer.html';
  }catch(err){
    msg.className='error'; msg.textContent=err.message;
  }
};
const AUTH_I18N={"Crnogorski":{"back":"← Nazad","login":"Login","subtitle":"Prijavite se svojim emailom.","email":"Email","password":"Šifra","submitLogin":"Login","noAccount":"Nemate nalog?","create":"Napravite profil","createTitle":"Kreirajte nalog","createSub":"Napravite Balkan Agent profil. Admin mora aktivirati nalog prije prve prijave.","name":"Ime i prezime","company":"Firma","phone":"Broj telefona","submitCreate":"Kreiraj nalog","backLogin":"← Login","creating":"Kreiranje...","created":"✓ Profil napravljen. Čeka aktivaciju Admina."},"English":{"back":"← Back","login":"Login","subtitle":"Sign in with your email.","email":"Email","password":"Password","submitLogin":"Login","noAccount":"No account?","create":"Create a profile","createTitle":"Create account","createSub":"Create your Balkan Agent profile. Admin activation is required before first login.","name":"Full name","company":"Company","phone":"Phone number","submitCreate":"Create account","backLogin":"← Login","creating":"Creating...","created":"✓ Profile created. Waiting for Admin activation."},"Deutsch":{"back":"← Zurück","login":"Login","subtitle":"Mit Ihrer E-Mail anmelden.","email":"E-Mail","password":"Passwort","submitLogin":"Login","noAccount":"Noch kein Konto?","create":"Profil erstellen","createTitle":"Konto erstellen","createSub":"Erstellen Sie Ihr Balkan-Agent-Profil. Vor der ersten Anmeldung ist die Admin-Aktivierung erforderlich.","name":"Vor- und Nachname","company":"Firma","phone":"Telefonnummer","submitCreate":"Konto erstellen","backLogin":"← Login","creating":"Wird erstellt...","created":"✓ Profil erstellt. Wartet auf Admin-Aktivierung."},"Русский":{"back":"← Назад","login":"Войти","subtitle":"Войдите с помощью электронной почты.","email":"Email","password":"Пароль","submitLogin":"Войти","noAccount":"Нет аккаунта?","create":"Создать профиль","createTitle":"Создать аккаунт","createSub":"Создайте профиль Balkan Agent. Перед первым входом требуется активация администратором.","name":"Имя и фамилия","company":"Компания","phone":"Телефон","submitCreate":"Создать аккаунт","backLogin":"← Войти","creating":"Создание...","created":"✓ Профиль создан. Ожидается активация администратором."},"Shqip":{"back":"← Kthehu","login":"Hyrje","subtitle":"Hyni me emailin tuaj.","email":"Email","password":"Fjalëkalimi","submitLogin":"Hyrje","noAccount":"Nuk keni llogari?","create":"Krijo profil","createTitle":"Krijo llogari","createSub":"Krijoni profilin Balkan Agent. Aktivizimi nga administratori kërkohet para hyrjes së parë.","name":"Emri dhe mbiemri","company":"Kompania","phone":"Numri i telefonit","submitCreate":"Krijo llogari","backLogin":"← Hyrje","creating":"Duke krijuar...","created":"✓ Profili u krijua. Pritet aktivizimi i administratorit."},"Slovenščina":{"back":"← Nazaj","login":"Prijava","subtitle":"Prijavite se z e-pošto.","email":"E-pošta","password":"Geslo","submitLogin":"Prijava","noAccount":"Nimate računa?","create":"Ustvari profil","createTitle":"Ustvari račun","createSub":"Ustvarite profil Balkan Agent. Pred prvo prijavo je potrebna aktivacija skrbnika.","name":"Ime in priimek","company":"Podjetje","phone":"Telefonska številka","submitCreate":"Ustvari račun","backLogin":"← Prijava","creating":"Ustvarjanje...","created":"✓ Profil je ustvarjen. Čaka na aktivacijo skrbnika."},"Македонски":{"back":"← Назад","login":"Најава","subtitle":"Најавете се со вашата е-пошта.","email":"Е-пошта","password":"Лозинка","submitLogin":"Најава","noAccount":"Немате сметка?","create":"Креирај профил","createTitle":"Креирај сметка","createSub":"Креирајте Balkan Agent профил. Потребна е активација од администратор пред првата најава.","name":"Име и презиме","company":"Компанија","phone":"Телефон","submitCreate":"Креирај сметка","backLogin":"← Најава","creating":"Се креира...","created":"✓ Профилот е креиран. Се чека активација од администратор."},"Български":{"back":"← Назад","login":"Вход","subtitle":"Влезте с вашия имейл.","email":"Имейл","password":"Парола","submitLogin":"Вход","noAccount":"Нямате профил?","create":"Създайте профил","createTitle":"Създаване на профил","createSub":"Създайте профил в Balkan Agent. Необходима е администраторска активация преди първото влизане.","name":"Име и фамилия","company":"Компания","phone":"Телефон","submitCreate":"Създай профил","backLogin":"← Вход","creating":"Създаване...","created":"✓ Профилът е създаден. Очаква активация от администратор."},"Ελληνικά":{"back":"← Πίσω","login":"Σύνδεση","subtitle":"Συνδεθείτε με το email σας.","email":"Email","password":"Κωδικός","submitLogin":"Σύνδεση","noAccount":"Δεν έχετε λογαριασμό;","create":"Δημιουργία προφίλ","createTitle":"Δημιουργία λογαριασμού","createSub":"Δημιουργήστε το προφίλ σας στο Balkan Agent. Απαιτείται ενεργοποίηση διαχειριστή πριν την πρώτη σύνδεση.","name":"Ονοματεπώνυμο","company":"Εταιρεία","phone":"Τηλέφωνο","submitCreate":"Δημιουργία λογαριασμού","backLogin":"← Σύνδεση","creating":"Δημιουργία...","created":"✓ Το προφίλ δημιουργήθηκε. Αναμένεται ενεργοποίηση διαχειριστή."},"Română":{"back":"← Înapoi","login":"Autentificare","subtitle":"Conectați-vă cu emailul.","email":"Email","password":"Parolă","submitLogin":"Autentificare","noAccount":"Nu aveți cont?","create":"Creați un profil","createTitle":"Creați cont","createSub":"Creați profilul Balkan Agent. Este necesară activarea de către administrator înainte de prima conectare.","name":"Nume complet","company":"Companie","phone":"Număr de telefon","submitCreate":"Creați cont","backLogin":"← Autentificare","creating":"Se creează...","created":"✓ Profil creat. Se așteaptă activarea administratorului."},"Türkçe":{"back":"← Geri","login":"Giriş","subtitle":"E-postanızla giriş yapın.","email":"E-posta","password":"Şifre","submitLogin":"Giriş","noAccount":"Hesabınız yok mu?","create":"Profil oluştur","createTitle":"Hesap oluştur","createSub":"Balkan Agent profilinizi oluşturun. İlk girişten önce yönetici aktivasyonu gerekir.","name":"Ad soyad","company":"Şirket","phone":"Telefon numarası","submitCreate":"Hesap oluştur","backLogin":"← Giriş","creating":"Oluşturuluyor...","created":"✓ Profil oluşturuldu. Yönetici aktivasyonu bekleniyor."}};const authLang=document.getElementById('authLang');function applyAuthLang(l){const t=AUTH_I18N[l]||AUTH_I18N.Crnogorski;document.documentElement.lang=l;localStorage.setItem('ba_auth_lang',l);const q=(x)=>document.querySelector(x);if('login'==='login'){q('.back').textContent=t.back;q('h1').textContent=t.login;q('.subtitle').textContent=t.subtitle;q('label').textContent=t.email;q('label+input')?.previousElementSibling&&(q('form .field:nth-child(2) label').textContent=t.password);q('form button').textContent=t.submitLogin;q('.help').firstChild.textContent=t.noAccount+' ';q('.help a').textContent=t.create}else{q('h1').textContent=t.createTitle;q('.sub').textContent=t.createSub;const ls=document.querySelectorAll('label');if(ls[0])ls[0].textContent=t.name;if(ls[1])ls[1].textContent=t.company;if(ls[2])ls[2].textContent=t.email;if(ls[3])ls[3].textContent=t.phone;if(ls[4])ls[4].textContent=t.password;document.querySelector('.btn').textContent=t.submitCreate;document.querySelector('.box>div:last-child a').textContent=t.backLogin}}authLang.value=localStorage.getItem('ba_auth_lang')||'Crnogorski';authLang.onchange=e=>applyAuthLang(e.target.value);applyAuthLang(authLang.value);
</script>
</body>
</html>
