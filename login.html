<!doctype html>
<html lang="me">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balkan Agent — Login</title>
<style>
:root{--bg:#020611;--panel:#07101d;--line:#183b60;--text:#f8f9fc;--muted:#9eacc0;--violet:#743cff;--blue:#0abfff;--green:#34e09a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 60% 0,#151c45,#020611 62%);color:var(--text);font:14px/1.5 system-ui;display:grid;place-items:center;padding:22px}
a{text-decoration:none;color:inherit}
button,input{font:inherit}
.loginBox{width:min(520px,100%);background:#06101d;border:1px solid #193b60;border-radius:17px;box-shadow:0 30px 90px #000;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:21px 24px;border-bottom:1px solid #17324f}
.brand{display:flex;align-items:center;gap:11px}
.ba{font-size:40px;font-weight:950;letter-spacing:-5px;background:linear-gradient(135deg,#00adff,#bd4cff,#ff8bdc);-webkit-background-clip:text;color:transparent}
.bn{font-size:19px;font-weight:850}.bn span{color:#6684ff}.tag{font-size:8px;color:#9ca9ba;letter-spacing:1.2px}
.back{color:#9fb4d2;font-size:12px}
.body{padding:28px 26px 30px}
h1{font-size:30px;margin:0 0 8px}
.subtitle{color:var(--muted);margin:0 0 23px}
.field{margin-bottom:14px}
label{display:block;color:#a6b3c4;font-size:12px;margin-bottom:6px}
input{width:100%;background:#06101d;color:#fff;border:1px solid #26466b;border-radius:9px;padding:12px}
.btn{width:100%;border:0;background:linear-gradient(135deg,#7538ff,#315cff);color:#fff;border-radius:10px;padding:13px 15px;cursor:pointer;font-weight:700}
#msg{font-size:12px;margin-top:12px;min-height:18px}
.error{color:#ff8190}.success{color:#34e09a}
.help{border-top:1px solid #17324f;padding:15px 26px;color:#8798ad;font-size:11px}
</style>
</head>
<body>
<div class="loginBox">
  <div class="header">
    <a href="index.html" class="brand">
      <div class="ba">BA</div>
      <div><div class="bn">BALKAN <span>AGENT</span></div><div class="tag">AI AUTOMATION PLATFORM</div></div>
    </a>
    <a href="index.html" class="back">← Nazad</a>
  </div>
  <div class="body">
    <h1>Login</h1>
    <p class="subtitle">Prijavite se svojim emailom.</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="email@company.com">
      </div><div class="field"><label>Šifra</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Login</button>
      <div id="msg"></div>
    </form>
  </div>
  <div class="help">Nemate nalog? <a href="register.html" style="color:#9eb2ff">Napravite profil</a></div>
</div>



<script>
document.getElementById('loginForm').onsubmit=async(e)=>{
  e.preventDefault();
  const msg=document.getElementById('msg');
  msg.className=''; msg.textContent='Prijava...';
  try{
    const r=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({
        email:document.getElementById('email').value.trim(),
        password:document.getElementById('password').value
      })
    });
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Login failed');
    location.href=j.role==='admin'?'admin.html':'customer.html';
  }catch(err){
    msg.className='error'; msg.textContent=err.message;
  }
};
</script>
</body>
</html>
